<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish - Special wishes for you</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #e91e63;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #e91e63;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #e91e63, #ff5722);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
        }

        .share-section {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .share-section.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        .share-link {
            width: 100%;
            padding: 10px;
            background: white;
            border: 2px solid #e91e63;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: #4caf50;
        }

        /* Wish View Page Styles */
        .wish-card {
            text-align: center;
        }

        .wish-card .cake {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .wish-card h2 {
            color: #e91e63;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .wish-card .from {
            color: #666;
            margin-top: 20px;
        }

        .wish-card .message {
            background: linear-gradient(135deg, #fff5f5, #fff0f0);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.2em;
            line-height: 1.8;
            color: #333;
        }

        .decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .balloon {
            position: absolute;
            font-size: 40px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: random;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="decorations" id="decorations"></div>
    
    <div class="container" id="mainContainer">
        <!-- Content will be inserted via JavaScript -->
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const wishData = urlParams.get('w');

        // Balloons and decorations
        const balloons = ['🎈', '🎉', '🎊', '⭐', '🌟'];
        const decorationsDiv = document.getElementById('decorations');
        
        for (let i = 0; i < 10; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.textContent = balloons[Math.floor(Math.random() * balloons.length)];
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.top = -50 + 'px';
            balloon.style.animationDelay = Math.random() * 2 + 's';
            balloon.style.fontSize = (30 + Math.random() * 30) + 'px';
            decorationsDiv.appendChild(balloon);
        }

        if (wishData) {
            // View Wish Page
            try {
                const data = JSON.parse(decodeURIComponent(atob(wishData)));
                renderWishView(data);
            } catch (e) {
                renderCreateForm();
            }
        } else {
            // Create Wish Page
            renderCreateForm();
        }

        function renderCreateForm() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <h1>🎂 Birthday Wish</h1>
                <p class="subtitle">Apna special wish banaein aur share karein</p>
                
                <form id="wishForm">
                    <div class="form-group">
                        <label>Wish kiska hai? (To)</label>
                        <input type="text" id="toName" placeholder="Jane ka naam likhein" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Kon bhej raha hai? (From)</label>
                        <input type="text" id="fromName" placeholder="Aapka naam" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Birthday person ka favorite color</label>
                        <select id="themeColor">
                            <option value="#e91e63">Pink</option>
                            <option value="#2196f3">Blue</option>
                            <option value="#4caf50">Green</option>
                            <option value="#ff9800">Orange</option>
                            <option value="#9c27b0">Purple</option>
                            <option value="#f44336">Red</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Your special message</label>
                        <textarea id="message" placeholder="Happy Birthday! Write your wish here..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn">Create Wish 🎉</button>
                </form>
                
                <div class="share-section" id="shareSection">
                    <p><strong>Apna wish share karein!</strong></p>
                    <input type="text" class="share-link" id="shareLink" readonly>
                    <button type="button" class="btn copy-btn" onclick="copyLink()">📋 Copy Link</button>
                </div>
            `;

            document.getElementById('wishForm').addEventListener('submit', createWish);
        }

        function createWish(e) {
            e.preventDefault();
            
            const data = {
                to: document.getElementById('toName').value,
                from: document.getElementById('fromName').value,
                message: document.getElementById('message').value,
                theme: document.getElementById('themeColor').value,
                cake: ['🎂', '🎈', '🎁'][Math.floor(Math.random() * 3)]
            };

            const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
            const shareUrl = window.location.origin + window.location.pathname + '?w=' + encoded;

            document.getElementById('shareSection').classList.add('show');
            document.getElementById('shareLink').value = shareUrl;
        }

        function renderWishView(data) {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="wish-card">
                    <div class="cake">${data.cake || '🎂'}</div>
                    <h2>Happy Birthday, ${escapeHtml(data.to)}! 🎉</h2>
                    <div class="message">${escapeHtml(data.message)}</div>
                    <p class="from">— From: ${escapeHtml(data.from)}</p>
                    <button class="btn" style="margin-top: 20px;" onclick="createNewWish()">Apna bhi wish banaein 🎈</button>
                </div>
            `;
            
            // Apply theme color
            if (data.theme) {
                document.querySelector('h2').style.color = data.theme;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copyLink() {
            const linkInput = document.getElementById('shareLink');
            linkInput.select();
            document.execCommand('copy');
            alert('Link copy ho gaya! Ab aap isse WhatsApp, Facebook ya kisi bhi platform par share kar sakte hain.');
        }

        function createNewWish() {
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
