<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday - Special Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ======== ALL CSS STYLES ======== */
        :root {
            --primary: #ff3080;
            --secondary: #c44569;
            --accent: #ffd700;
            --accent2: #ff6b35;
            --purple: #8e44ad;
            --blue: #3498db;
            --green: #2ecc71;
            --white: #ffffff;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
            min-height: 100vh;
        }

        /* BACKGROUND ANIMATION */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatOrb 10s infinite linear;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* NAVIGATION */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 50px;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 30px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--dark);
            font-weight: 600;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 25px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background: var(--primary);
            color: var(--white);
        }

        /* PAGE SECTIONS */
        .page {
            display: none;
            min-height: 100vh;
            padding: 100px 5% 50px;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HERO SECTION */
        .hero {
            min-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 90px;
            font-weight: 900;
            color: var(--white);
            text-shadow: 4px 4px 0 var(--primary), 8px 8px 0 rgba(0,0,0,0.1);
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .hero .subtitle {
            font-size: 28px;
            color: var(--white);
            margin: 20px 0;
        }

        .hero-emoji {
            font-size: 180px;
            animation: float 3s ease-in-out infinite;
            margin: 30px 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 18px 45px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--white);
            box-shadow: 0 10px 40px rgba(255, 48, 128, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(255, 48, 128, 0.5);
        }

        .btn-white {
            background: var(--white);
            color: var(--primary);
        }

        .btn-accent {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            color: var(--dark);
        }

        /* FORMS */
        .form-card {
            background: var(--white);
            border-radius: 30px;
            padding: 50px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .form-card h2 {
            font-size: 40px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 10px;
        }

        .form-card .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .form-group input, 
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 18px 25px;
            font-size: 18px;
            border: 3px solid #eee;
            border-radius: 15px;
            transition: 0.3s;
            background: var(--light);
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus, 
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 10px 30px rgba(255, 48, 128, 0.15);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* SHARE SECTION */
        .share-section {
            background: linear-gradient(135deg, #f0f0f0, #fff);
            border-radius: 20px;
            padding: 40px;
            margin-top: 30px;
            display: none;
            text-align: center;
        }

        .share-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .share-link {
            width: 100%;
            padding: 20px;
            font-size: 16px;
            border: 3px solid var(--primary);
            border-radius: 15px;
            margin: 20px 0;
            background: var(--white);
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .social-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            transform: scale(1.2) rotate(10deg);
        }

        .social-btn.whatsapp { background: #25D366; color: white; }
        .social-btn.facebook { background: #1877F2; color: white; }
        .social-btn.twitter { background: #1DA1F2; color: white; }
        .social-btn.telegram { background: #0088cc; color: white; }
        .social-btn.copy { background: var(--primary); color: white; }

        /* GIFTS SECTION */
        .gifts-section {
            padding: 50px 0;
        }

        .gifts-title {
            font-size: 50px;
            color: var(--white);
            text-align: center;
            margin-bottom: 50px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .gift-box {
            background: var(--white);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .gift-box:hover {
            transform: translateY(-15px) scale(1.05);
        }

        .gift-box .emoji {
            font-size: 100px;
            display: block;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .gift-box .label {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            margin-top: 15px;
        }

        /* VIEW WISH PAGE */
        .wish-view {
            min-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            text-align: center;
        }

        .wish-view .celebration-emoji {
            font-size: 120px;
            animation: bounce 1s infinite;
            margin-bottom: 20px;
        }

        .wish-view h1 {
            font-size: 60px;
            color: var(--white);
            font-weight: 900;
            text-shadow: 4px 4px 0 var(--primary);
            margin-bottom: 20px;
            animation: rainbow 3s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff3080; }
            25% { color: #ffd700; }
            50% { color: #2ecc71; }
            75% { color: #3498db; }
            100% { color: #ff3080; }
        }

        .wish-view .name {
            font-size: 45px;
            color: var(--white);
            margin-bottom: 30px;
        }

        .wish-view .message-box {
            background: var(--white);
            border-radius: 30px;
            padding: 50px;
            max-width: 700px;
            font-size: 24px;
            line-height: 2;
            color: var(--dark);
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            margin: 30px 0;
            position: relative;
        }

        .wish-view .message-box::before {
            content: '"';
            font-size: 100px;
            color: var(--primary);
            opacity: 0.3;
            position: absolute;
            top: -20px;
            left: 20px;
        }

        .wish-view .from {
            color: rgba(255,255,255,0.9);
            font-size: 22px;
            margin-top: 20px;
        }

        /* BALLOONS */
        .balloons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .balloon {
            position: absolute;
            font-size: 60px;
            animation: rise 10s linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) rotate(15deg); opacity: 0.7; }
        }

        /* CONFETTI */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            animation: confettiFall 4s linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0.5; }
        }

        /* PHOTO GALLERY */
        .gallery-section {
            padding: 50px 0;
        }

        .gallery-title {
            font-size: 50px;
            color: var(--white);
            text-align: center;
            margin-bottom: 50px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery-item {
            background: var(--white);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-10px) rotate(2deg);
        }

        .gallery-item .emoji {
            font-size: 100px;
        }

        .gallery-item .caption {
            font-size: 20px;
            font-weight: 600;
            color: var(--dark);
            margin-top: 15px;
        }

        /* QUOTES */
        .quotes-section {
            padding: 50px 0;
        }

        .quotes-title {
            font-size: 50px;
            color: var(--white);
            text-align: center;
            margin-bottom: 50px;
        }

        .quotes-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .quote {
            background: var(--white);
            border-radius: 25px;
            padding: 40px;
            margin: 25px 0;
            font-size: 22px;
            line-height: 1.8;
            color: var(--dark);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border-left: 6px solid var(--primary);
        }

        .quote .author {
            color: var(--primary);
            font-weight: 600;
            margin-top: 15px;
            font-size: 18px;
        }

        /* FOOTER */
        .footer {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            text-align: center;
            margin-top: 50px;
        }

        .footer p {
            color: #666;
            font-size: 16px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 50px; }
            .hero-emoji { font-size: 120px; }
            .form-card { padding: 30px 20px; }}
